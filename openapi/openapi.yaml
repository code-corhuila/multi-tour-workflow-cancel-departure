openapi: 3.0.3
info:
  title: Multitour saga cancel-departure
  version: 0.1.0
  description: >
    Entry of the saga that cancels a departure and handles its reservations (ADR-004 D3, spec HU-WFL-004). Operations-cost cancels
    the departure; then commercial-reservation leaves without effect the proposals that point to it and opens the rescheduling
    episode of each reservation. A cancellation cannot be undone, so the saga has no compensation: it goes forward, repeats what
    failed with the same keys, and ends FAILED, naming the reservations left, for a person to decide. The Tenant Administrator
    starts it and reads it, with the tenant of the token. Job 3 starts it for a tenant that is inactive through the internal route,
    which the gateway never routes, with a service token and the tenant in the path. Every error uses the single envelope below and
    never carries the internal detail of a failure; the detail stays in the saga state and the log.
paths:
  /api/v1/sagas/cancel-departure:
    post:
      summary: Cancel a departure and handle its reservations
      description: >
        For the Tenant Administrator; the tenant is the one of the token, never of the body. Repeating the same Idempotency-Key
        returns the same saga with 200 and runs no step. The saga runs before answering and the answer says COMPLETED, FAILED or,
        when the cancellation was refused and nothing changed, COMPENSATED, except when a participant gave no clear answer: then it
        is RUNNING and the saga goes on by itself (the same keys are asked again) until it ends or, after fifteen minutes, FAILED.
        A departure that does not exist is a 404.
      operationId: startCancelDeparture
      tags: [Sagas]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCancelDepartureRequest"
      responses:
        "201":
          description: The saga started and ended
          headers:
            Location:
              description: URL of the saga
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saga"
        "200":
          description: The Idempotency-Key was already used; the existing saga
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saga"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/sagas/cancel-departure/{id}:
    get:
      summary: Read the state of a cancellation
      description: For the Tenant Administrator; a saga of another tenant is a 404.
      operationId: getCancelDeparture
      tags: [Sagas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The saga
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saga"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/sagas/internal/tenants/{tenantId}/cancel-departure:
    post:
      summary: Cancel a departure of a tenant, for job 3
      description: >
        For the SERVICE role only (job 3, when the tenant is inactive at the start time of a departure); the token of a person is a
        403. The tenant is the one of the path, and it may be inactive. The gateway never routes it. The rest is as for the
        route of the Tenant Administrator.
      operationId: startCancelDepartureForTenant
      tags: [Internal]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCancelDepartureRequest"
      responses:
        "201":
          description: The saga started and ended
          headers:
            Location:
              description: URL of the saga
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saga"
        "200":
          description: The Idempotency-Key was already used; the existing saga
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saga"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    CorrelationId:
      description: Reused from the request or generated
      schema:
        type: string
  responses:
    Error:
      description: Error envelope
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StartCancelDepartureRequest:
      type: object
      required: [departureCode]
      additionalProperties: false
      properties:
        departureCode:
          type: string
          minLength: 1
          maxLength: 40
          description: Code of the departure, as operations-cost shows it
    Saga:
      type: object
      required: [id, status, departureCode, completedSteps, handledReservations, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [RUNNING, COMPLETED, COMPENSATED, FAILED]
        departureCode:
          type: string
        completedSteps:
          type: array
          description: The steps that ended, in order; failedStep says where the saga stopped
          items:
            type: string
            enum: [CANCEL_DEPARTURE, VOID_PROPOSALS, OPEN_EPISODES]
        failedStep:
          type: string
          enum: [CANCEL_DEPARTURE, VOID_PROPOSALS, OPEN_EPISODES]
        reason:
          type: string
          description: A short code for why the saga did not complete, never the text of a participant
          enum: [DEPARTURE_REFUSED, RESERVATIONS_FAILED, PARTICIPANT_UNAVAILABLE]
        handledReservations:
          type: integer
          minimum: 0
          description: The reservations whose episode is open
        reservationsLeft:
          type: array
          description: The ids of the reservations whose episode is not open, for a person to decide; ids only, never a name or a text
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error, message, traceId]
      properties:
        error:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, INTERNAL_ERROR]
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        traceId:
          type: string
security:
  - bearerAuth: []
